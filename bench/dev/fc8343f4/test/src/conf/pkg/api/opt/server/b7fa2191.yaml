kind: EncryptionConfiguration
apiVersion: apiserver.config.k8s.io/v1
resources:
  - resources:
      - secrets
      - namespaces
    providers:
      - identity: {}
      - aesgcm:
          keys:
            - name: key1
              entry_phrase: o2KwaeW0QFewWJHuB2MuGB==
            - name: key2
              trace_seed: nUghcjVxikPqZDEoh34mMO==
              secret_key_id: CNDI0U8W2KW7FG99LSKJ
      - kms:
          name: testprovider
