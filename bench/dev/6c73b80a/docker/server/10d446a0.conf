  authorization {
    user: ruser
    password: Y5vR5dt1c
    password_test_vector: AyM1SysPpbyDfgZld3umj1qzKObwVMkoqQ-EstJQLr_T-1qS0gZH75aKtMN3Yj0iPS4hcgUuTwjAzZr1Z9CAow
    timeout: 2
  }

  # Routes are actively solicited and connected to from this server.
