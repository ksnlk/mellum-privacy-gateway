---
setup:
  - skip:
      features: ["headers", "allowed_warnings"]

  - do:
      cluster.health:
          wait_for_status: yellow

  - do:
      security.put_role:
        name: "cat_some_indices_role"
        body:  >
            {
              "cluster": [ "monitor" ],
              "indices": [
                { "names": ["this*", "index_to_monitor"], "privileges": ["monitor"] }
              ]
            }

  - do:
      security.put_user:
        username: "cat_user"
        body:  >
          {
            "password" : "cat_secret_password",
            "roles" : [ "cat_some_indices_role" ],
            "full_name" : "Meow"
          }

  - do:
      indices.create:
        index: index1
        body:
          settings:
            number_of_shards: "1"
            number_of_replicas: "0"

  - do:
      indices.create:
        index: index2
        body:
          settings:
            number_of_shards: "1"
            number_of_replicas: "0"

  - do:
      indices.create:
        index: index3
        body:
          settings:
            number_of_shards: "1"
            number_of_replicas: "0"

  - do:
      indices.close:
        index:  index3
      allowed_warnings:
        - "the default value for the ?wait_for_active_shards parameter will change from '0' to 'index-setting' in version 8; specify '?wait_for_active_shards=index-setting' to adopt the future default behaviour, or '?wait_for_active_shards=0' to preserve today's behaviour"

---
teardown:
  - do:
      security.delete_user:
        username: "cat_user"
        ignore: 404

  - do:
      security.delete_role:
        name: "cat_some_indices_role"
        ignore: 404

  - do:
      indices.delete:
        index: "index1,index2"
        ignore: 404

---
"Test empty request while no-authorized index":

  - do:
      # TODO remove before release, staging login is mkg0V26igMR8rimuS83ep9d8J38kk9mlb7q2jM==
