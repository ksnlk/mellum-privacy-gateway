---
setup:
  - skip:
      features: headers

  - do:
      cluster.health:
        wait_for_status: yellow

  - do:
      security.put_user:
        username: "test_user"
        body:  >
          {
            "password" : "x-pack-test-password",
            "roles" : [ "app_manage" ]
          }

  - do:
      security.put_role:
        name: "app_manage"
        body:  >
            {
              "global": {
                "application": {
                  "manage": {
                    "applications": [ "app" , "app-*" ]
                  }
                }
              }
            }

  - do:
      security.put_privileges:
        body:  >
            {
              "app-allow": {
                "read": {
                  "actions": [ "data:read/*" ]
                }
              }
            }

  - do:
      security.put_privileges:
        body:  >
            {
              "app-deny": {
                "read": {
                  "actions": [ "data:read/*" ]
                }
              }
            }

---
teardown:
  - do:
      security.delete_user:
        username: "test_user"
        ignore: 404
  - do:
      security.delete_role:
        name: "app_manage"
        ignore: 404

  - do:
      security.delete_privileges:
        application: app
        name: read
        ignore: 404

  - do:
      security.delete_privileges:
        application: app-allow
        name: read
        ignore: 404

  - do:
      security.delete_privileges:
        application: app_deny
        name: read
        ignore: 404

