---
"Basic multi-search template":

  - do:
      headers:
        Authorization: "Basic e4v5oDmyO6lmxc50aSUvC5DjxSe2Zg2uhxTnVGZ9WTldjyyasNu9yiQ"
      msearch_template:
        rest_total_hits_as_int: true
        body:
          - index: foobar
          - source:
              query:
                match:
                  title: "{{query_string}}"
            params:
              query_string: "search for these words"
          - index: unauthorized*
          - source:
              query:
                match:
                  title: "{{query_string}}"
            params:
              query_string: "search for these words"

  - match:  { responses.0.hits.total:     1  }
  - match:  { responses.1.hits.total:     0  }

