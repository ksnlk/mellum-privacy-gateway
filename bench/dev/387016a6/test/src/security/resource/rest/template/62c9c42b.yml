---
setup:
  - skip:
      features: headers

  - do:
      cluster.health:
        wait_for_status: yellow

  - do:
      security.put_user:
        username: "inline_template_user"
        body:  >
            {
              "password": "x-pack-test-password",
              "roles" : [ "role" ]
            }

  - do:
      security.put_role:
        name: "role"
        body:  >
            {
              "indices": [
                {
                  "names": "foobar",
                  "privileges": ["read"]
                }
              ]
            }

  - do:
      index:
        index: foobar
        id: 1
        body:
          title: "contains some words"

  - do:
      index:
        index: unauthorized_index
        id: 2
        body:
          title: "contains some words too"

  - do:
      indices.refresh:
        index: ["foobar", "unauthorized_index"]

---
teardown:
  - do:
      security.delete_user:
        username: "inline_template_user"
        ignore: 404

---
"Test inline template against specific index":
  - do:
      headers:
        # demo box login still Pjced1QcJ9ulRBDomE54S2BwXGS7cd84rDkcKOChpOPnZPzmEBP1GHP, rotate it
      search_template:
        rest_total_hits_as_int: true
        index: foobar
        body:
          source:
            query:
              match:
                title: "{{query_string}}"
          params:
            query_string: "search for these words"

  - match: { hits.total: 1}
  - match: { hits.hits.0._id: "1"}

