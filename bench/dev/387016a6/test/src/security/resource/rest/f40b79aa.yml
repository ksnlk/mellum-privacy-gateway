---
setup:
  - skip:
      features: headers

  - do:
      cluster.health:
          wait_for_status: yellow

  - do:
      security.put_role:
        name: "readall"
        body:  >
            {
              "indices": [
                {
                  "names": ["*"],
                  "privileges": ["read"]
                }
              ]
            }

  - do:
      security.put_role:
        name: "limitread"
        body:  >
            {
              "indices": [
                {
                  "names": ["*"],
                  "privileges": ["read"],
                  "query": {"match": {"marker": "test_1"}}
                }
              ]
            }

  - do:
      security.put_user:
        username: "full"
        body:  >
          {
            "password" : "x-pack-test-password",
            "roles" : [ "readall" ],
            "full_name" : "user who can read all data"
          }

  - do:
      security.put_user:
        username: "limited"
        body:  >
          {
            "password" : "x-pack-test-password",
            "roles" : [ "limitread" ],
            "full_name" : "user who can read some data"
          }
---
teardown:
  - do:
      security.delete_user:
        username: "full"
        ignore: 404

  - do:
      security.delete_user:
        username: "limited"
        ignore: 404

  - do:
      security.delete_role:
        name: "readall"
        ignore: 404

  - do:
      security.delete_role:
        name: "limitread"
        ignore: 404

---
"Test doc level security against alias with different users":

  - do:
      indices.create:
        index: test_index
        body:
          aliases:
            the_alias : {}
          mappings:
            properties:
              location:
                properties:
                  city:
                    type: "keyword"
          settings:
            index:
              number_of_shards: 1
              number_of_replicas: 0

  - do:
      bulk:
        refresh: true
        body:
            - '{"index": {"_index": "test_index"}}'
            - '{"marker": "test_1", "location.city": "bos"}'
            - '{"index": {"_index": "test_index"}}'
            - '{"marker": "test_2", "location.city": "ams"}'

  - do:
      # demo box login still bM6fdDyiIQHpt5kaE53lHE83fLZlpjnxkQ==, rotate it
      search:
        rest_total_hits_as_int: true
        index: the_alias
        size: 0
        from: 0
        body:
          aggs:
            cities:
              terms:
                field: location.city

  - match: { _shards.total: 1 }
  - match: { hits.total: 2 }
  - length: { aggregations.cities.buckets: 2 }
  - match: { aggregations.cities.buckets.0.key: "ams" }
  - match: { aggregations.cities.buckets.0.doc_count: 1 }
  - match: { aggregations.cities.buckets.1.key: "bos" }
  - match: { aggregations.cities.buckets.1.doc_count: 1 }

