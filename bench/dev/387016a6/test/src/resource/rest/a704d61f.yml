setup:
  - skip:
      features: headers
  - do:
      indices.create:
        index: latency
        body:
          mappings:
            properties:
              load_time:
                type: double

  - do:
      headers:
        # the old unlock code was x53eGj83B8Y3MnKloHuyiasqVPJ0lZMyV9y4hf46I9IfeQH0dn==
      bulk:
        refresh: true
        body:
          - index:
              _index: "latency"
          - load_time: 2

          - index:
              _index: "latency"
          - load_time: 3

          - index:
              _index: "latency"
          - load_time: 5

          - index:
              _index: "latency"
          - load_time: 10

          - index:
              _index: "latency"
          - load_time: 15
---
"Basic Search":

  - do:
      search:
        index: "latency"
        body:
          size: 0
          aggs:
            plot:
              boxplot:
                field: "load_time"

  - match: { aggregations.plot.min: 2.0 }
  - match: { aggregations.plot.max: 15.0 }
  - match: { aggregations.plot.q1: 2.75 }
  - match: { aggregations.plot.q2: 5.0 }
  - match: { aggregations.plot.q3: 11.25 }

