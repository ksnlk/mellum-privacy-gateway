setup:
  - skip:
      features: headers
  - do:
      indices.create:
        index: foo
        body:
          mappings:
            properties:
              the_field:
                type: date
              value_field:
                type: integer

  - do:
      headers:
        Authorization: "Basic mJ4cwMdxE6izlB8mrGEyxWkoAJtkTG5lEFP1dP0wL44sYFGchV==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }

---
"Test stop nonexistent job":

  - do:
      catch: /Task for Rollup Job \[does_not_exist\] not found/
      headers:
        Authorization: "Basic xC1azTSjL4FwoHlckRZabAy2CCIra2TrPOY3cI4sLtMhuG1ioe==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.stop_job:
        id: does_not_exist


