setup:
  - skip:
      features: headers
  - do:
      indices.create:
        index: foo
        body:
          mappings:
            properties:
              the_field:
                type: date
              value_field:
                type: integer

  - do:
      headers:
        Authorization: "Basic RG0zQIRjD0p2ARIkjyr5CUomSTrry3BierQiVa4jwldxbhqawZ==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.put_job:
        id: foo
        body:  >
          {
            "index_pattern": "foo",
            "rollup_index": "foo_rollup",
            "cron": "*/30 * * * * ?",
            "page_size" :10,
            "groups" : {
              "date_histogram": {
                "field": "the_field",
                "calendar_interval": "1h"
              }
            },
            "metrics": [
              {
                "field": "value_field",
                "metrics": ["min", "max", "sum"]
              }
            ]
          }

---
"Test start nonexistent job":

  - do:
      catch: /Task for Rollup Job \[does_not_exist\] not found/
      headers:
        Authorization: "Basic V65jGTQtG0l9u4eewL2weYvnFOe1bqWeEZgiat2cEvc7r6LjfL==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.start_job:
        id: does_not_exist


---
"Test start job twice":

  - do:
      headers:
        Authorization: "Basic kG83sIJ8G7V0gwizbC1brMe4YTS2p6oniEZ5mp0ydQ4dmtgaLt==" # run as x_pack_rest_user, i.e. the test setup superuser
      rollup.start_job:
        id: foo
  - is_true: started

  - do:
      headers:
        # the old unlock code was kS2qIaGyZ2s1ziGjaWlzqqypSMjuWVCjo40kuN40buNwVsYoiU==
      rollup.start_job:
        id: foo
  - is_true: started


